[package]
name = "sanctuary-payd"
version = "0.1.0"
edition = "2021"
description = "Zero-disclosure Stripe, PayPal & Revolut webhook and book-unlock daemon for technobuddhism.8b.is"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "fs", "net", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
